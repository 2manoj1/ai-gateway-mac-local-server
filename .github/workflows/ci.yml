name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  model-gateway:
    name: Model Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/model-gateway
    env:
      ADMIN_SECRET: sk-admin-secret-change-me
      DATABASE_URL: postgresql+psycopg://aigateway:change-me-later@localhost:5432/aigateway
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      OLLAMA_BASE_URL: http://localhost:11434/v1
      DEFAULT_MODEL: qwen3.5:9b
      APP_NAME: Gateway API
      ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: apps/model-gateway/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check src tests alembic

      - name: Lint
        run: uv run ruff check src tests alembic

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
